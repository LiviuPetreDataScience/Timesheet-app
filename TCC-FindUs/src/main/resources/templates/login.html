<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FindUs - Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
        }
        .login-container {
            background: #fff;
            max-width: 400px;
            margin: 60px auto 0 auto;
            padding: 32px 28px 28px 28px;
            border-radius: 8px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.08);
        }
        h2 {
            text-align: center;
            margin-bottom: 28px;
            color: #2d3a4b;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 7px;
            color: #34495e;
            font-weight: 500;
        }
        input[type="text"], select {
            width: 100%;
            padding: 9px 10px;
            border: 1px solid #cfd8dc;
            border-radius: 4px;
            font-size: 15px;
            background: #f9fafb;
            transition: border 0.2s;
        }
        input[type="text"]:focus, select:focus {
            border-color: #1976d2;
            outline: none;
        }
        .login-btn {
            width: 100%;
            padding: 11px 0;
            background: #1976d2;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .login-btn:hover {
            background: #125ea7;
        }
        .error-message {
            color: #d32f2f;
            background: #ffebee;
            border: 1px solid #ffcdd2;
            padding: 10px 14px;
            border-radius: 4px;
            margin-bottom: 18px;
            font-size: 15px;
        }
        .footer {
            text-align: center;
            margin-top: 32px;
            color: #b0bec5;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>FindUs Login</h2>
        <form th:action="@{/login}" method="post" autocomplete="off">
            <div th:if="${loginError}" class="error-message" th:text="${loginError}"></div>
            <div class="form-group">
                <label for="username">Username</label>
                <input id="username" name="username" type="text" maxlength="32" required autofocus
                       th:value="${param.username}" placeholder="Enter your username"/>
            </div>
            <div class="form-group">
                <label for="role">Role</label>
                <select id="role" name="role" required>
                    <option value="" disabled selected>Select your role</option>
                    <option th:each="role : ${roles}"
                            th:value="${role}"
                            th:text="${#strings.capitalize(role.name().replace('_', ' ').toLowerCase())}"
                            th:selected="${param.role == role}"></option>
                </select>
            </div>
            <button class="login-btn" type="submit">Login</button>
        </form>
    </div>
    <div class="footer">
        &copy; 2024 FindUs. All rights reserved.
    </div>
</body>
</html>
