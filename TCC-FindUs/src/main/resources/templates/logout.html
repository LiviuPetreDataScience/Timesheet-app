<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Logged Out - FindUs</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
        }
        .logout-container {
            background: #fff;
            max-width: 400px;
            margin: 80px auto 0 auto;
            padding: 32px 28px 28px 28px;
            border-radius: 8px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.08);
            text-align: center;
        }
        h2 {
            color: #2d3a4b;
            margin-bottom: 18px;
        }
        .logout-message {
            color: #34495e;
            font-size: 17px;
            margin-bottom: 28px;
        }
        .login-link {
            display: inline-block;
            padding: 10px 28px;
            background: #1976d2;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.2s;
        }
        .login-link:hover {
            background: #125ea7;
        }
        .footer {
            text-align: center;
            margin-top: 32px;
            color: #b0bec5;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="logout-container">
        <h2>Logged Out</h2>
        <div class="logout-message">
            You have been successfully logged out.
        </div>
        <a class="login-link" th:href="@{/login}">Back to Login</a>
    </div>
    <div class="footer">
        &copy; 2024 FindUs. All rights reserved.
    </div>
</body>
</html>
